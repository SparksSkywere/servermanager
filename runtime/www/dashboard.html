<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Dashboard — Server Manager</title>
  <link rel="stylesheet" href="/css/site.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <header class="top">
    <strong>Server Manager</strong>
    <nav>
      <a href="/dashboard.html">Servers</a>
      <a href="/cluster.html">Cluster</a>
      <a href="/admin.html">Admin</a>
      <a href="/diagnostics.html">Diagnostics</a>
      <button id="logout">Logout</button>
    </nav>
  </header>
  <main>
    <section class="metrics-panel">
      <h2>System Information</h2>
      <div class="charts">
        <canvas id="cpuChart" height="80"></canvas>
        <canvas id="memChart" height="80"></canvas>
        <canvas id="diskChart" height="80"></canvas>
      </div>
    </section>
    <div class="toolbar">
      <h1>Servers</h1>
      <button id="refresh">Refresh</button>
      <a class="btn" href="/create-server.html">Create</a>
      <label class="btn secondary" style="cursor:pointer">Import<input id="import-file" type="file" accept=".json,.smserver.json" hidden /></label>
      <button id="update-all" class="btn secondary">Update All</button>
      <button id="checkpoint-db" class="btn secondary">Checkpoint DB</button>
    </div>
    <p id="tool-msg" class="muted"></p>
    <table id="servers">
      <thead><tr><th>Name</th><th>Type</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody></tbody>
    </table>
    <section>
      <h2>Console</h2>
      <select id="console-server"></select>
      <pre id="console"></pre>
      <form id="cmd-form">
        <input id="cmd" placeholder="command" />
        <button type="submit">Send</button>
      </form>
    </section>
  </main>
  <script src="/js/config.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
